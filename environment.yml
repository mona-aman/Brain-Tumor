    - scikit-image>=0.21.0
    - pandas>=2.0.0
    - matplotlib>=3.7.0
    - seaborn>=0.12.0
    - wandb>=0.15.0
    - pyyaml>=6.0
    - omegaconf>=2.3.0
    - lpips>=0.1.4
    - pytest>=7.4.0